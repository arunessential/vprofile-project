version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - cp ./settings.xml /root/.m2/settings.xml
      - export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain arunaws --domain-owner 047719654980 --region us-east-1 --query authorizationToken --output text)

  pre_build:
    commands:
      - apt-get update
      - apt-get install -y jq
      - echo "Maven version:"
      - mvn -version  # Check the preinstalled Maven version

  build:
    commands:
      - mvn clean install -DskipTests

artifacts:
  files:
    - target/**/*.war
  discard-paths: yes
